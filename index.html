
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio QR Generator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: white;
            background:
                radial-gradient(circle at 10% 20%, rgba(99,102,241,.35), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(6,182,212,.3), transparent 30%),
                linear-gradient(135deg, #09090f, #111827 55%, #0f172a);
        }

        .container {
            width: min(500px, 92%);
            padding: 40px 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.07);
            backdrop-filter: blur(20px);
            border-radius: 26px;
            box-shadow: 0 25px 70px rgba(0,0,0,.25);
        }

        .brand {
            color: #67e8f9;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 48px);
            margin-bottom: 15px;
            background: linear-gradient(90deg, #fff, #a5b4fc, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .qr-frame {
            width: 270px;
            height: 270px;
            max-width: 100%;
            margin: auto;
            padding: 15px;
            background: white;
            border-radius: 20px;
        }

        .qr-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .scan-text {
            color: #cbd5e1;
            margin: 25px 0;
            font-size: 14px;
        }

        .visit-link {
            display: inline-block;
            padding: 13px 24px;
            border-radius: 30px;
            background: #6366f1;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .visit-link:hover {
            background: #4f46e5;
        }

        footer {
            margin-top: 30px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="brand">PORTFOLIO ACCESS</div>

        <h1>Portfolio QR Generator</h1>

        <p class="description">
            Scan the QR code to explore my portfolio.
        </p>

        <div class="qr-frame">
            <img src="static/portfolio_qr.png"
                 alt="Portfolio QR Code">
        </div>

        <p class="scan-text">
            Scan the QR code with your phone camera.
        </p>

        <a class="visit-link"
           href="https://subtle-cheesecake-01abe0.netlify.app/">
            Visit Portfolio
        </a>

        <footer>Built with Python · QRCode · HTML · CSS</footer>
    </main>
</body>
</html>
